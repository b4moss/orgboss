name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache test results
        uses: actions/cache@v4
        id: test-cache
        with:
          path: |
            src/coverage.out
            src/coverage.html
          key: ${{ runner.os }}-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-test-

      - name: Check for code changes
        id: changes
        run: |
          if git diff --quiet ${{ github.event.pull_request.base.sha }} ${{ github.sha }} -- 'src/**/*.go' '!src/**/*_test.go'; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run unit tests
        if: steps.changes.outputs.changed == 'true' || steps.test-cache.outputs.cache-hit != 'true'
        working-directory: src
        run: |
          go test -short -v ./...

      - name: Run unit tests with coverage
        if: steps.changes.outputs.changed == 'true' || steps.test-cache.outputs.cache-hit != 'true'
        working-directory: src
        run: |
          go test -short -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -html=coverage.out -o coverage.html

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check for code changes
        id: changes
        run: |
          if git diff --quiet ${{ github.event.pull_request.base.sha }} ${{ github.sha }} -- 'src/**/*.go'; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Start Docker Compose services
        if: steps.changes.outputs.changed == 'true'
        working-directory: src
        run: |
          docker compose up -d
          sleep 10  # Wait for services to be ready

      - name: Wait for PostgreSQL
        if: steps.changes.outputs.changed == 'true'
        run: |
          until docker compose -f src/compose.yml exec -T orgboss-db pg_isready -U orgboss; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run database migrations
        if: steps.changes.outputs.changed == 'true'
        working-directory: src
        run: |
          docker compose exec -T orgboss-dev go run cmd/migrate/main.go

      - name: Run integration tests
        if: steps.changes.outputs.changed == 'true'
        working-directory: src
        env:
          DATABASE_URL: postgres://orgboss:orgboss@orgboss-db:5432/orgboss?sslmode=disable
          DB_HOST: orgboss-db
          DB_PORT: 5432
          DB_USER: orgboss
          DB_PASSWORD: orgboss
          DB_NAME: orgboss
          SMTP_HOST: mailpit
          SMTP_PORT: 1025
          SMTP_FROM: noreply@example.com
          MAILPIT_URL: http://mailpit:8025
        run: |
          docker compose exec -T orgboss-dev go test -v -run TestIntegration ./...

      - name: Stop Docker Compose services
        if: always() && steps.changes.outputs.changed == 'true'
        working-directory: src
        run: |
          docker compose down -v

