services:
  orgboss-dev:
    build:
      context: .
      dockerfile: Dockerfile
    command: air
    volumes:
      - .:/app
      - go-pkg:/go/pkg/mod
    ports:
      - "8080:8080"
    environment:
      - GO_ENV=development
      - DATABASE_URL=postgres://orgboss:orgboss@orgboss-db:5432/orgboss?sslmode=disable
      - DB_HOST=orgboss-db
      - DB_PORT=5432
      - DB_USER=orgboss
      - DB_PASSWORD=orgboss
      - DB_NAME=orgboss
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=noreply@example.com
    depends_on:
      - orgboss-db
      - mailpit
    networks:
      - orgboss-network

  orgboss-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=orgboss
      - POSTGRES_PASSWORD=orgboss
      - POSTGRES_DB=orgboss
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - orgboss-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI port
    networks:
      - orgboss-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  go-pkg:
  postgres-data:

networks:
  orgboss-network:
    driver: bridge